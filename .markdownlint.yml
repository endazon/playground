# .markdownlint.yml
# 参考: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md

default: true

# MD013: 行長制限 — 日本語混在のため無効化
MD013: false

# MD022: 見出し周囲の空行 — コンパクトスタイルのため無効化
MD022: false

# MD031: コードブロック周囲の空行 — コンパクトスタイルのため無効化
MD031: false

# MD032: リスト周囲の空行 — コンパクトスタイルのため無効化
MD032: false

# MD058: テーブル周囲の空行 — コンパクトスタイルのため無効化
# 既に無効化している MD022（見出し周囲）・MD031（コードブロック周囲）・MD032（リスト周囲）の
# テーブル版であり、本リポジトリの記述スタイルと同じ理由で揃える。
MD058: false

# MD033: インライン HTML — Mermaid コードブロック等で使う場合を考慮
MD033: false

# MD060: テーブルのパイプ揃え — 無効化
# markdownlint v0.41 で追加された新ルール。`default: true` のため、
# markdownlint-cli2-action の更新に伴い既存文書 60 ファイル・473 件が一斉に違反となった。
# 本リポジトリのテーブルは日本語の全角文字を含み、見た目の桁揃えと文字数が一致しない。
# 揃えを強制すると全角幅の異なる環境で崩れ、確定（fixed）済み文書の大量書き換えも要る。
# 内容ではなく体裁のみのルールであり、レビュー可能性を損なわないため無効化する。
MD060: false

# MD041: 最初の行は H1 見出しであること — メタ情報ブロックがある場合に備え無効化
MD041: false

# MD024: 見出しの重複 — 兄弟レベルは許可（異なる階層は禁止）
MD024:
  siblings_only: true

# MD025: H1 は1つ — フロントマターの title フィールドは H1 として扱わない
MD025:
  front_matter_title: ""

# MD007: 箇条書きインデント — 2スペースに統一
MD007:
  indent: 2

# MD010: タブ文字禁止
MD010: true

# MD047: ファイル末尾に改行
MD047: true
