[package]
name = "ipemu-server"
description = "配信 API (/api/v1) + 管理 API (/api/admin) + ポータル / 管理 SPA の静的配信"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ipemu-server"
path = "src/main.rs"

[dependencies]
ipemu-core = { workspace = true }
ipemu-wasm = { workspace = true }
ipemu-sign = { workspace = true }
ed25519-dalek = "2"
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
clap = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "sync", "time"] }
axum = { version = "0.8", features = ["multipart", "json", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "limit", "set-header", "compression-gzip"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "json"] }
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["std", "rand_core"] }
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
wasmparser = "0.261"
subtle = "2"
mime_guess = "2"
bytes = "1"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
