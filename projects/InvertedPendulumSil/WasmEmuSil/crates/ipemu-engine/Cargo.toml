[package]
name = "ipemu-engine"
description = "クライアントのエミュレータエンジン。M1 では headless CLI (run / validate / inspect / lqr)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ipemu-engine"
path = "src/main.rs"

[dependencies]
ipemu-core = { workspace = true }
ipemu-wasm = { workspace = true }
ip-model = { workspace = true, features = ["std"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
ipemu-sign = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
ipemu-server = { path = "../ipemu-server" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
