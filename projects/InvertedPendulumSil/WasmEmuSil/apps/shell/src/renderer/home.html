<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>ipemu — ホーム</title>
    <link rel="stylesheet" href="./shell.css" />
  </head>
  <body>
    <div class="page">
      <div>
        <h1>ipemu</h1>
        <div class="sub">サーバのポータルを開いてカタログから「起動」するか、ローカルの構成 (開発用) を組み立てます。</div>
      </div>
      <section class="panel">
        <h2>エンジン</h2>
        <div class="row"><span id="engine" class="sub">未起動</span><button class="btn" id="refresh">更新</button><button class="btn primary" id="open-sim" disabled>シミュレータを開く</button></div>
      </section>
      <section class="panel">
        <h2>ローカルカタログ (開発用)</h2>
        <div class="list" id="catalog"><span class="sub">読み込み中…</span></div>
        <div class="row" style="margin-top: 8px">
          <input id="manifest-path" placeholder="/path/to/dev/cartpole.manifest.json" style="flex: 1" />
          <button class="btn" id="launch-path">組み立てる</button>
        </div>
        <div class="sub" id="launch-msg"></div>
      </section>
      <section class="panel">
        <h2>信頼するサーバ (window.ipemu を注入する origin)</h2>
        <div class="list" id="trusted"></div>
        <div class="row" style="margin-top: 8px">
          <input id="trusted-add" placeholder="https://ipemu.example" style="flex: 1" />
          <button class="btn" id="trusted-add-btn">追加</button>
        </div>
        <div class="sub">厳密一致。HTTPS のみ (開発用に http://localhost を許可: <input type="checkbox" id="allow-localhost" />)。設定ファイル: <code id="settings-path"></code></div>
      </section>
    </div>
    <script type="module" src="./home.ts"></script>
  </body>
</html>
