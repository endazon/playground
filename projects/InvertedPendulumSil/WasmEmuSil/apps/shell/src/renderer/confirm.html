<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>起動の確認</title>
    <link rel="stylesheet" href="./shell.css" />
  </head>
  <body>
    <div class="page" style="margin-top: 14px">
      <div>
        <h1>この構成を起動しますか?</h1>
        <div class="sub">外部 (ブラウザやリンク) から <code>ipemu://</code> で起動が要求されました。内容を確認してください。</div>
      </div>
      <section class="panel">
        <div class="kv" id="kv"></div>
        <div id="problems" style="margin-top: 8px"></div>
        <div class="warnbox" style="margin-top: 8px">要求 capability (ネットワーク / ファイル) は、構成の取得後に同意ダイアログで個別に確認します。</div>
      </section>
      <div class="row" style="justify-content: flex-end">
        <button class="btn" id="cancel">キャンセル</button>
        <button class="btn primary" id="ok">起動する</button>
      </div>
    </div>
    <script type="module" src="./confirm.ts"></script>
  </body>
</html>
