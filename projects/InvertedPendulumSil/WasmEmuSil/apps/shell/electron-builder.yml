# 配布 (M6: 6 プラットフォームの未署名 zip, D17 / D64)。通常は直接ではなく scripts/package.sh から呼ぶ。
#   - 実行時の依存は無い (main / preload は esbuild、renderer は vite で束ねる) ので、files は dist/ だけ
#   - エンジンは scripts/package.sh が IPEMU_ENGINE_DIR に置いた ipemu-engine(.exe) を resources/bin/ へ同梱する。
#     main/index.ts は packaged のとき process.resourcesPath/bin/ から探す
#   - arch は CLI (--x64 / --arm64) で、成果物名 (artifactName) と出力先は package.sh が -c.* で渡す
#
# 署名は既定で無効 (未署名 zip)。後から有効にする手順 (どれも CI/環境変数側の設定で、コードは変えない):
#   macOS:   mac.identity の `null` を消し、CSC_LINK / CSC_KEY_PASSWORD (または keychain) を与える。
#            公証は notarize: true と APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER (または APPLE_ID 系) 。
#            hardenedRuntime / entitlements は下のコメントを外す
#   Windows: win.signAndEditExecutable の `false` を消し、CSC_LINK / CSC_KEY_PASSWORD (Azure Trusted Signing 等は
#            win.azureSignOptions) を与える。Linux ホストから署名する場合は osslsigncode が要る
#   Linux:   署名なし (zip)
appId: dev.ipemu.shell
productName: ipemu
copyright: ipemu
directories:
  output: ../../dist
files:
  - dist/**
  - package.json
asar: true
publish: null                   # 配布は社内サーバ / 手渡し。自動更新 (app-update.yml) は作らない
compression: normal
extraResources:
  - from: ${env.IPEMU_ENGINE_DIR}
    to: bin
    filter: ["ipemu-engine", "ipemu-engine.exe"]
protocols:
  - name: ipemu
    schemes: [ipemu]
mac:
  target: [{ target: zip }]
  category: public.app-category.education
  identity: null                # 署名しない。署名するときはこの行を消す
  # hardenedRuntime: true
  # gatekeeperAssess: false
  # entitlements: build/entitlements.mac.plist
  # notarize: true
win:
  target: [{ target: zip }]
  signAndEditExecutable: false  # 署名と rcedit (アイコン / バージョン資源の書き込み) を省く。署名するときはこの行を消す
linux:
  target: [{ target: zip }]
  category: Education
  executableName: ipemu
