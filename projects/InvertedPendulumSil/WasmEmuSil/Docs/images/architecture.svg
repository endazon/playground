<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic UI','Meiryo','IPAPGothic',sans-serif" font-size="14">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
  <style>
    .t  { fill:#0f172a; }
    .s  { fill:#475569; font-size:12px; }
    .h  { fill:#0f172a; font-weight:700; font-size:16px; }
    .h2 { fill:#0f172a; font-weight:700; font-size:14px; }
    .h3 { fill:#0f172a; font-weight:700; font-size:12.5px; }
    .mono { font-family: ui-monospace, Consolas, 'SF Mono', Menlo, monospace; font-size:12px; fill:#0f172a; }
    .box { fill:#ffffff; stroke:#94a3b8; stroke-width:1.2; rx:6; }
    .zone { fill:#f8fafc; stroke:#64748b; stroke-width:1.5; stroke-dasharray:6 4; rx:10; }
    .srv { fill:#eef2ff; stroke:#6366f1; }
    .eng { fill:#ecfdf5; stroke:#10b981; }
    .shl { fill:#fff7ed; stroke:#f97316; }
    .dev { fill:#fef2f2; stroke:#ef4444; }
    .wasm { fill:#f5f3ff; stroke:#8b5cf6; }
    .fw  { fill:#fdf4ff; stroke:#d946ef; }
    .line { stroke:#475569; stroke-width:1.6; fill:none; marker-end:url(#arr); }
    .lineB { stroke:#1d4ed8; stroke-width:1.8; fill:none; marker-end:url(#arrB); }
    .lineR { stroke:#b91c1c; stroke-width:1.8; fill:none; stroke-dasharray:5 4; marker-end:url(#arrR); }
    .lblB { fill:#1d4ed8; font-size:12px; font-weight:700; }
    .lblR { fill:#b91c1c; font-size:12px; font-weight:700; }
  </style>

  <rect width="1400" height="1040" fill="#ffffff"/>
  <text x="24" y="34" class="h" font-size="20">WasmEmuSil 構成図 — サーバ (ポータル + 配信 + 管理) / クライアント (Electron シェル + Rust エンジン) / 開発ツール</text>
  <text x="24" y="56" class="s">利用者はシェル (または通常のブラウザ) でサーバのポータルを開き、カタログから構成を選んで「起動」する。制御ループは仮想 MCU の中で閉じる。</text>

  <!-- ===================== SERVER ===================== -->
  <rect x="24" y="80" width="420" height="400" class="zone srv"/>
  <text x="40" y="106" class="h">サーバアプリ  ipemu-server</text>
  <text x="40" y="124" class="s">Rust / axum / tokio ・ Docker + リバースプロキシ (TLS)</text>

  <rect x="40" y="140" width="388" height="78" class="box"/>
  <text x="52" y="160" class="h2">配信 API  /api/v1   (セッショントークン or API キー)</text>
  <text x="52" y="180" class="mono">GET  catalog                → 利用者に公開された構成</text>
  <text x="52" y="196" class="mono">GET  manifests/{id}         → 署名付き JSON</text>
  <text x="52" y="212" class="mono">GET  artifacts/{name}/{ver} → .wasm (ETag=sha256)</text>

  <rect x="40" y="228" width="388" height="112" class="box"/>
  <text x="52" y="248" class="h2">SPA  (Vite + React + TS)   /portal + /admin</text>
  <text x="52" y="268" class="t">・ポータル: ログイン → カタログ → 「起動」(ブリッジ / ipemu://)</text>
  <text x="52" y="286" class="t">・管理: 部品登録 (WIT 抽出)、manifest 検証→承認→公開</text>
  <text x="52" y="304" class="t">・公開範囲、ユーザ / ロール、API キー、監査、起動履歴</text>
  <text x="52" y="324" class="s">ロール分離: editor (下書き) ≠ approver (承認・公開)</text>

  <rect x="40" y="350" width="186" height="116" class="box"/>
  <text x="52" y="370" class="h2">保存</text>
  <text x="52" y="390" class="t">artifacts/ 内容アドレス</text>
  <text x="52" y="406" class="mono">sha256/ab/cd/&lt;hex&gt;</text>
  <text x="52" y="426" class="t">SQLite (sqlx)</text>
  <text x="52" y="442" class="s">manifests / users / launches /</text>
  <text x="52" y="456" class="s">approvals / telemetry / audit</text>

  <rect x="242" y="350" width="186" height="116" class="box"/>
  <text x="254" y="370" class="h2">認証・署名</text>
  <text x="254" y="390" class="t">ローカルアカウント (argon2id)</text>
  <text x="254" y="406" class="s">user / editor / approver / admin</text>
  <text x="254" y="426" class="t">Ed25519 で manifest 署名</text>
  <text x="254" y="442" class="s">manifest 検証は ipemu-core</text>
  <text x="254" y="456" class="s">(クライアントと同一クレート)</text>

  <!-- ===================== LEGEND ===================== -->
  <rect x="24" y="500" width="420" height="400" class="zone"/>
  <text x="40" y="526" class="h">凡例 / 流れる物</text>
  <rect x="40" y="540" width="18" height="12" class="zone srv"/><text x="66" y="551" class="t">サーバ</text>
  <rect x="140" y="540" width="18" height="12" class="zone shl"/><text x="166" y="551" class="t">UI シェル</text>
  <rect x="240" y="540" width="18" height="12" class="zone eng"/><text x="266" y="551" class="t">エンジン</text>
  <rect x="340" y="540" width="18" height="12" class="zone wasm"/><text x="366" y="551" class="t">WASM 部品</text>
  <rect x="40" y="562" width="18" height="12" class="box fw"/><text x="66" y="573" class="t">仮想 MCU / ファームウェア</text>
  <rect x="240" y="562" width="18" height="12" class="box dev"/><text x="266" y="573" class="t">開発専用</text>

  <text x="40" y="606" class="h2">構成情報 (manifest)</text>
  <text x="40" y="624" class="t">部品・パラメータ・配線・周期・capability を記した JSON。</text>
  <text x="40" y="640" class="t">サーバが版管理と承認・署名、クライアントが検証して組み立て。</text>
  <text x="40" y="668" class="h2">アーティファクト</text>
  <text x="40" y="686" class="t">部品 wasm / ファームウェア wasm / UI バンドル。sha256 で同定。</text>
  <text x="40" y="702" class="t">イミュータブル。キャッシュと CDN に載る。</text>
  <text x="40" y="730" class="h2">起動の入口</text>
  <text x="40" y="748" class="t">ポータルの「起動」。シェル内は window.ipemu、</text>
  <text x="40" y="764" class="t">Chrome / Edge からは ipemu:// リンク (確認ダイアログ付き)。</text>
  <text x="40" y="792" class="h2">capability</text>
  <text x="40" y="810" class="t">宣言 (manifest) → 承認・署名 (サーバ) → 初回同意 (クライアント)。</text>
  <text x="40" y="826" class="t">宣言のない import は link されず、実体化で失敗する。</text>
  <text x="40" y="854" class="h2">クライアントは対象を知らない</text>
  <text x="40" y="872" class="t">部品・FW・UI・構成はすべて配信物。別の機構も登録だけで動く。</text>
  <text x="40" y="888" class="t">本体更新が要るのは組み込み部品 / WIT / IPC の非互換変更のみ。</text>

  <!-- ===================== CLIENT ===================== -->
  <rect x="490" y="80" width="886" height="820" class="zone"/>
  <text x="506" y="106" class="h">クライアントアプリ  (Windows / macOS / Linux × x64 / arm64)</text>
  <text x="506" y="124" class="s">2 プロセス構成。シェルはシミュレータの状態を持たず、エンジンは UI なしでも動く。v1 は同時 1 セッション。</text>

  <!-- server <-> engine corridor (y 140..195) -->
  <path d="M444,160 L1000,160 L1000,256" class="lineB"/>
  <text x="470" y="152" class="lblB">① 「起動」→ 署名付き manifest   ② 不足アーティファクトを取得して sha256 照合   (HTTPS, 利用者のセッショントークン)</text>
  <path d="M1060,256 L1060,182 L444,182" class="line" stroke-dasharray="3 3" opacity="0.8"/>
  <text x="470" y="196" class="s">③ telemetry: 実行要約 (開始 / 終了 / FAULT / capability 使用回数)。既定 on、クライアント設定で off</text>

  <!-- shell -> server portal browsing -->
  <path d="M506,296 L444,296" class="lineB"/>
  <text x="466" y="289" class="lblB">⓪</text>

  <!-- Shell -->
  <rect x="506" y="204" width="300" height="440" class="zone shl"/>
  <text x="520" y="228" class="h">UI シェル  (Electron, 汎用ブラウザ)</text>
  <text x="520" y="246" class="s">差し替え可能: Electrobun(CEF) / Qt WebEngine / cef-rs</text>

  <rect x="520" y="260" width="272" height="118" class="box"/>
  <text x="532" y="280" class="h2">main (Node)</text>
  <text x="532" y="298" class="t">・タブ / アドレスバー (任意のサイト可)</text>
  <text x="532" y="316" class="t">・信頼 origin にだけ window.ipemu を注入</text>
  <text x="532" y="334" class="t">・ipemu:// ハンドラ (外部ブラウザから起動)</text>
  <text x="532" y="352" class="t">・エンジン起動・監視、app://、同意</text>
  <text x="532" y="370" class="s">sandbox / contextIsolation / 全ページで Node 不可</text>

  <rect x="520" y="390" width="272" height="150" class="box"/>
  <text x="532" y="410" class="h2">renderer (Chromium)</text>
  <text x="532" y="430" class="t">⓪ ポータル (サーバのページ) を閲覧 → 「起動」</text>
  <text x="532" y="448" class="t">シミュレータ UI (app://, 配信物)</text>
  <text x="532" y="466" class="t">・2D / 3D / スコープ  (sim-view.js を移植)</text>
  <text x="532" y="484" class="t">・トポロジ図、操作 (開始 / 停止 / パラメータ)</text>
  <text x="532" y="508" class="s">FW 差替: wasm はホット (状態保持) / native は再起動</text>
  <text x="532" y="526" class="s">状態は IPC の state 通知を描くだけ</text>

  <rect x="520" y="552" width="272" height="78" class="box"/>
  <text x="532" y="572" class="h2">IPC 契約  (crates/ipemu-ipc)</text>
  <text x="532" y="590" class="s">ループバック WebSocket + トークン</text>
  <text x="532" y="606" class="s">JSON-RPC: session.launch / 操作 / consent ⇄ answer</text>
  <text x="532" y="622" class="s">MessagePack: state (50Hz), scope ストリーム</text>

  <!-- IPC arrows in the gap -->
  <line x1="806" y1="330" x2="866" y2="330" class="lineB" marker-start="url(#arrB)"/>
  <text x="822" y="322" class="lblB">IPC</text>
  <line x1="806" y1="470" x2="866" y2="470" class="lineB" marker-start="url(#arrB)"/>
  <text x="822" y="462" class="lblB">IPC</text>

  <!-- Engine -->
  <rect x="866" y="204" width="494" height="680" class="zone eng"/>
  <text x="880" y="228" class="h">エンジン  ipemu-engine  (Rust + Wasmtime)</text>
  <text x="880" y="246" class="s">headless CLI / テストからも同じ IPC で接続できる</text>

  <rect x="880" y="256" width="226" height="92" class="box"/>
  <text x="892" y="276" class="h2">bootstrap</text>
  <text x="892" y="296" class="t">launch → manifest → 署名検証</text>
  <text x="892" y="314" class="t">→ artifacts 取得 → sha256 照合</text>
  <text x="892" y="332" class="s">資格: セッション / チケット / API キー</text>

  <rect x="1120" y="256" width="226" height="92" class="box"/>
  <text x="1132" y="276" class="h2">ipemu-core</text>
  <text x="1132" y="296" class="t">manifest 検証 (V1〜V12)</text>
  <text x="1132" y="314" class="t">配線グラフ・実行順 (閉路検査)</text>
  <text x="1132" y="332" class="t">capability 判定・同意の問合せ</text>

  <rect x="880" y="360" width="466" height="66" class="box"/>
  <text x="892" y="380" class="h2">scheduler  (単一スレッド・仮想時間・固定ステップ 1ms)</text>
  <text x="892" y="400" class="t">操作をステップ境界で反映 → 実行順に step → 配線に従い転記 → pacing</text>
  <text x="892" y="418" class="s">realtime / fast / step。ブレーク中は仮想時間も止まる。暴走は epoch で trap</text>

  <!-- Wasmtime box -->
  <rect x="880" y="438" width="466" height="330" class="zone wasm"/>
  <text x="894" y="460" class="h2">Wasmtime  (Component Model / WIT  ip:emu@0.1.0)</text>
  <text x="894" y="476" class="s">部品ごとに Store。wasi:* は承認・同意済みのものだけ link。NaN 正規化で決定的</text>

  <rect x="894" y="488" width="112" height="64" class="box wasm"/>
  <text x="902" y="506" class="h3">plant-cartpole</text>
  <text x="902" y="523" class="s" font-size="11">台車+振子+モータ</text>
  <text x="902" y="539" class="s" font-size="11">RK4 1ms / ip-model</text>

  <rect x="1014" y="488" width="104" height="64" class="box wasm"/>
  <text x="1022" y="506" class="h3">motor-driver</text>
  <text x="1022" y="523" class="s" font-size="11">PWM→電圧</text>
  <text x="1022" y="539" class="s" font-size="11">保護 (E-STOP/TO)</text>

  <rect x="1126" y="488" width="98" height="64" class="box wasm"/>
  <text x="1134" y="506" class="h3">encoder ×2</text>
  <text x="1134" y="523" class="s" font-size="11">量子化・計数</text>
  <text x="1134" y="539" class="s" font-size="11">cart / pend.</text>

  <rect x="1232" y="488" width="104" height="64" class="box wasm"/>
  <text x="1240" y="506" class="h3">comm-link</text>
  <text x="1240" y="523" class="s" font-size="11">遅延・ジッタ・</text>
  <text x="1240" y="539" class="s" font-size="11">再送スパイク</text>

  <!-- wires between parts -->
  <path d="M1014,536 L1006,536" class="line"/>
  <path d="M1118,520 L1126,520" class="line"/>
  <text x="992" y="566" class="s" font-size="10">◀ voltage</text>

  <!-- cpu-virtual -->
  <rect x="894" y="578" width="442" height="180" class="box fw"/>
  <text x="906" y="598" class="h2">builtin:cpu-virtual — 仮想 MCU (1kHz, 実行時間 zero/fixed/fuel)</text>
  <text x="906" y="614" class="s">周辺 = ポート (enc0/1, pwm0, gpio, uart0) → HAL レジスタ像 → firmware.tick()</text>

  <rect x="906" y="624" width="418" height="124" class="box fw" stroke-dasharray="4 3"/>
  <text x="918" y="643" class="h2">FW slot "balance" — 外部から注入 (HAL のみ依存、C 版 / Rust 版)</text>
  <rect x="918" y="654" width="196" height="84" class="box"/>
  <text x="928" y="672" class="h2">fw-balance.wasm  (配布形・正)</text>
  <text x="928" y="690" class="s">wasm32-wasip2、全環境で同一</text>
  <text x="928" y="706" class="s">ホット差替 (状態保持) / fuel 計時</text>
  <text x="928" y="722" class="s">LLDB (DWARF) でソースデバッグ</text>
  <rect x="1124" y="654" width="190" height="84" class="box dev"/>
  <text x="1134" y="672" class="h2">fw_balance.dll/.so  (開発形)</text>
  <text x="1134" y="690" class="s">同じソース / 差替はエンジン再起動</text>
  <text x="1134" y="706" class="s">Visual Studio で F5 / アタッチ</text>
  <text x="1134" y="722" class="s">決定性・サンドボックスの保証外</text>

  <!-- wires parts <-> mcu -->
  <path d="M1175,552 L1175,578" class="line"/>
  <text x="1182" y="572" class="s" font-size="11">count</text>
  <path d="M1066,578 L1066,552" class="line"/>
  <text x="1072" y="572" class="s" font-size="11">pwm0, enable</text>
  <path d="M1284,552 L1284,578" class="line"/>
  <text x="1290" y="572" class="s" font-size="11">uart</text>

  <!-- capability box -->
  <rect x="880" y="778" width="466" height="96" class="box"/>
  <text x="892" y="798" class="h2">capability の実施  (WASI preview 2)</text>
  <text x="892" y="816" class="t">宣言 (manifest) → 承認・署名 (サーバ) → 初回同意 (シェルのダイアログ) → link</text>
  <text x="892" y="834" class="mono">net → wasi:sockets (socket_addr_check)   fs → preopened_dir</text>
  <text x="892" y="850" class="mono">clock / random → 宣言時のみ (決定性外)   hostExt → host-ext/*</text>
  <text x="892" y="866" class="s">宣言のない import は link しない → 実体化で失敗。承認なしに呼ばれる経路がない。</text>

  <!-- ===================== DEV TOOLS ===================== -->
  <rect x="490" y="920" width="886" height="100" class="zone dev"/>
  <text x="506" y="944" class="h">開発・デバッグ</text>
  <text x="640" y="944" class="lblR">デバッガはエンジンプロセスにアタッチする。ブレーク中は仮想時間が止まるので、再開しても保護は鳴らない</text>
  <rect x="506" y="956" width="276" height="52" class="box"/>
  <text x="516" y="974" class="h2">Visual Studio (Windows)</text>
  <text x="516" y="992" class="s">engine を起動して開発形 DLL にブレーク</text>
  <rect x="796" y="956" width="276" height="52" class="box"/>
  <text x="806" y="974" class="h2">VS Code + CodeLLDB (全 OS)</text>
  <text x="806" y="992" class="s">native 形にアタッチ / wasm 形は DWARF 経由</text>
  <rect x="1086" y="956" width="276" height="52" class="box"/>
  <text x="1096" y="974" class="h2">headless CLI / scripts/check.sh</text>
  <text x="1096" y="992" class="s">ゴールデン、manifest 検証、lint。CI は置かない</text>

  <path d="M600,956 C600,905 1219,920 1219,884" class="lineR"/>
</svg>
