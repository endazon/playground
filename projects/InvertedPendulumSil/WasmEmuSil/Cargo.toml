[workspace]
resolver = "2"
members = [
    "crates/ip-model",
    "crates/ipemu-core",
    "crates/ipemu-wasm",
    "crates/ipemu-engine",
    "crates/ip-hal",
    "crates/ip-part-sdk",
    "crates/ip-cmath",
    "components/plant-cartpole",
    "components/motor-driver",
    "components/encoder",
    "components/comm-link",
    "components/tcp-reporter",
    "firmware/fw-balance-rs",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
ip-model = { path = "crates/ip-model", default-features = false }
ip-hal = { path = "crates/ip-hal" }
ip-part-sdk = { path = "crates/ip-part-sdk" }
ipemu-core = { path = "crates/ipemu-core" }
ipemu-wasm = { path = "crates/ipemu-wasm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
libm = "0.2"
wit-bindgen = { version = "0.63", default-features = false, features = ["macros", "realloc"] }
wasmtime = { version = "50", default-features = false, features = ["anyhow", "runtime", "cranelift", "component-model", "std", "cache", "parallel-compilation", "wat"] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p2"] }
libloading = "0.9"
clap = { version = "4", features = ["derive"] }
sha2 = "0.11"
hex = "0.4"
proptest = "1"

# 部品 / ファームウェアの wasm は小さく、決定的にする
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.dev]
panic = "abort"
